name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned on purpose: with --strict, a future CLI release must never turn a
      # green, untouched repo red. Bump this deliberately.
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code@2.1.267

      # Structural checks only - no login, no API key, no repo secrets.
      - name: Validate marketplace
        run: claude plugin validate . --strict

      - name: Validate plugins
        run: |
          for plugin in plugins/*/; do
            echo "== $plugin"
            claude plugin validate "$plugin" --strict
          done
